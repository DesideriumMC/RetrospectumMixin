name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Java 7 API
        id: java7
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '7'
      - name: Install Java 8 compiler
        id: java8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
      - name: Install build JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check source inventory
        run: python scripts/check_repository.py
      - name: Build and verify runtime
        env:
          JAVA7_HOME: ${{ steps.java7.outputs.path }}
          JAVA8_HOME: ${{ steps.java8.outputs.path }}
        run: |
          bash ./gradlew --no-daemon --console=plain "-Pjava7Home=$JAVA7_HOME" "-Porg.gradle.java.installations.paths=$JAVA7_HOME,$JAVA8_HOME,$JAVA_HOME" clean build :mixin-bootstrap:mixinDistribution
          python scripts/verify_artifacts.py
          python scripts/audit_legacy_runtime.py --jar runtime/mixin-bootstrap/build/libs/retrospectum-mixin-0.1.0.jar --jdk "$JAVA7_HOME" --reference-jdk "$JAVA8_HOME" --java 7 --output build/reports/java7-api.json
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: retrospectum-mixin-${{ runner.os }}
          path: |
            runtime/mixin-bootstrap/build/libs/retrospectum-mixin-0.1.0.jar
            runtime/mixin-bootstrap/build/libs/retrospectum-mixin-0.1.0-sources.jar
            runtime/mixin-bootstrap/build/libs/retrospectum-mixin-0.1.0-javadoc.jar
            build/distributions/*-maven.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: retrospectum-mixin-reports-${{ runner.os }}
          path: |
            build/reports/
            runtime/mixin-bootstrap/build/reports/
          if-no-files-found: ignore
          retention-days: 14
