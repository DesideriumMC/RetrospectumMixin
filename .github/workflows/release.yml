name: Release Maven

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable Maven version (MAJOR.MINOR.PATCH)'
        required: true
      publish:
        description: 'Upload to the public Maven repository'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: maven-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}

  deliver:
    needs: verify
    if: inputs.publish && github.ref == 'refs/heads/main'
    environment: maven-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-publish.txt
      - uses: actions/download-artifact@v7
        with:
          name: maven-repository-Linux
          path: build/maven
      - name: Publish immutable artifacts and merged metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/publish_maven.py
