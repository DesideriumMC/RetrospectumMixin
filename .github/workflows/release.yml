name: Release Maven

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable Maven version (MAJOR.MINOR.PATCH)'
        required: true
        default: '0.1.0'
      publish:
        description: 'Upload to the public Maven repository'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: maven-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}

  deliver:
    needs: verify
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      R2_ENDPOINT: https://e6929f5cc53275d304a1000110a7dbcd.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install 'boto3>=1.36,<2'
      - uses: actions/download-artifact@v7
        with:
          name: maven-repository-Linux
          path: build/maven
      - name: Verify R2 credentials
        run: |
          python - <<'PY'
          import os
          import boto3
          if not os.environ.get('AWS_ACCESS_KEY_ID') or not os.environ.get('AWS_SECRET_ACCESS_KEY'):
              raise SystemExit('Grant this repository access to R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY')
          client = boto3.client('s3', endpoint_url=os.environ['R2_ENDPOINT'], region_name='auto')
          client.list_objects_v2(Bucket='desiderium-maven', Prefix='releases/dev/desiderium/retro/', MaxKeys=1)
          print('R2 credentials can read the Maven bucket')
          PY
      - name: Publish immutable artifacts and merged metadata
        if: inputs.publish
        run: python scripts/publish_maven.py
