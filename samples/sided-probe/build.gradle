plugins { id 'dev.desiderium.retro.loom' }
group = 'dev.desiderium.retro.mixin.samples'
version = '0.1.0-SNAPSHOT'
repositories { maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } }
dependencies {
    minecraft 'com.mojang:minecraft:1.6.4'
    forge 'net.minecraftforge:forge:1.6.4-9.11.1.1345:universal'
    mappings 'net.minecraftforge:forge:1.6.4-9.11.1.1345:src@zip'
    mixinBootstrap project(path: ':mixin-bootstrap', configuration: 'shadow')
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}
retrospectum.mixin('main', 'mixins.retromixin.p1.refmap.json')
retrospectum.mixinConfig('mixins.retromixin.p1.json')
